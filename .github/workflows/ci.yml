name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + API tests (RBAC, ABAC, audit chain, PII, injection)
        run: pytest
      - name: Offline eval quality gate (fails the build on regression)
        run: python -m evals.run_evals
      # The Claude eval lives in llm-eval.yml and runs only on demand (Actions > llm-eval > Run workflow).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: backend/evals/reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        # --load: put the image in the local image store (some runner builders only keep it in cache)
        run: docker buildx build --load -t veritas:ci .
      - name: Container smoke test
        # Failures are echoed as ::error:: annotations, which (unlike step logs) are readable via the public API.
        run: |
          fail() { echo "::error title=$1::$(printf '%s' "$2" | tail -c 1500 | tr '\n' ' ')"; exit 1; }
          out=$(docker image inspect veritas:ci --format '{{.Id}}' 2>&1) || fail "image missing" "$out"
          out=$(docker run -d --name veritas-smoke -p 18080:8000 -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci veritas:ci 2>&1) \
            || fail "docker run failed" "$out"
          for i in $(seq 1 45); do curl -fs localhost:18080/healthz && break; sleep 1; done
          curl -fs localhost:18080/healthz | grep -q '"ok"' || fail "container not healthy" "$(docker logs veritas-smoke 2>&1)"
          echo "healthy: $(curl -fs localhost:18080/healthz)"

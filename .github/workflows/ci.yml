name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + API tests (RBAC, ABAC, audit chain, PII, injection)
        run: pytest
      - name: Offline eval quality gate (fails the build on regression)
        run: python -m evals.run_evals
      # The Claude eval lives in llm-eval.yml and runs only on demand (Actions > llm-eval > Run workflow).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: backend/evals/reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        # --load: put the image in the local image store (some runner builders only keep it in cache)
        run: docker buildx build --load -t veritas:ci .
      - name: Container smoke test
        run: |
          docker image inspect veritas:ci --format 'image {{.Id}}'
          docker run -d --name v -p 8000:8000 -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci veritas:ci
          for i in $(seq 1 45); do curl -fs localhost:8000/healthz && break; sleep 1; done
          if ! curl -fs localhost:8000/healthz | grep '"ok"'; then
            echo "::error::container did not become healthy; logs follow"
            docker logs v
            exit 1
          fi

services:
  veritas:
    build: .
    ports: ["8000:8000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}   # empty = SQLite on the veritas-data volume
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGINS: http://localhost:8000
    volumes: ["veritas-data:/data"]
    restart: unless-stopped

  # Optional local observability: Prometheus scraping /metrics
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

volumes:
  veritas-data:

# Render Blueprint: New > Blueprint > pick this repo. Builds the Dockerfile.
# Data lives in an external Postgres (e.g. Neon's free tier), so the free web plan works: no disk needed.
services:
  - type: web
    name: veritas
    runtime: docker
    plan: free               # sleeps when idle; the first request after that takes ~30-60s
    healthCheckPath: /healthz
    autoDeploy: true         # deploys only after CI (tests + eval gate) passes on main
    envVars:
      - key: DATABASE_URL
        sync: false          # paste the Postgres connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # optional; without it answers are extractive
      - key: VOYAGE_API_KEY
        sync: false
      - key: SEED_DEMO
        value: "true"        # set to false for a real tenant-only deployment
      - key: CORS_ORIGINS
        value: https://veritas.onrender.com
      - key: RATE_LIMIT_PER_MIN
        value: "20"
